name: Build SuperGear

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Download Spigot API
        run: |
          mkdir -p libs
          curl -L -o libs/spigot-api.jar https://hub.spigotmc.org/nexus/content/repositories/public/org/spigotmc/spigot-api/1.21-R0.1-SNAPSHOT/spigot-api-1.21-R0.1-SNAPSHOT.jar
      - name: Compile
        run: |
          mkdir -p out
          find src/main/java -name "*.java" > sources.txt
          javac -cp libs/spigot-api.jar -d out @sources.txt
          mkdir -p out_final
          cp -r out/* out_final/
          cp -r src/main/resources/* out_final/
          cd out_final && jar cfe ../SuperGear.jar com.supergear.SuperGearPlugin .
      - name: Upload Jar
        uses: actions/upload-artifact@v4
        with:
          name: SuperGear
          path: SuperGear.jar
